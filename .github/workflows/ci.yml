name: Project checks

on:
  push:
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            server/pnpm-lock.yaml
      - name: Install game dependencies
        run: pnpm install --frozen-lockfile
      - name: Install ghost service dependencies
        run: pnpm install --dir server --frozen-lockfile
      - name: Check TypeScript
        run: pnpm typecheck
      - name: Run game tests
        run: pnpm test
      - name: Build client and matching server simulation
        run: pnpm build
      - name: Run ghost service protocol tests
        run: pnpm test:server
